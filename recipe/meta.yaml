{% set version = "3.6.0.post1" %}

package:
  name: caputlog
  version: "{{ version }}"

source:
  - git_url: https://github.com/epics-modules/caPutLog.git
    git_rev: b544f92c6efe1df98506b567f3f7e5137965e2a4
  - path: ../src


build:
  number: 0
  run_exports:
    - {{ pin_subpackage('caputlog', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r caputlog

about:
  home: https://github.com/epics-modules/caPutLog
  license: EPICS Open License
  summary: "Channel Access Put Logger, from DESY/BESSY"
