{% set version = "3.6.0" %}

package:
  name: caputlog
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/caPutLog/archive/R3.6.tar.gz
    sha256: 5527a87df2e7884b78adbbd248b4d72a64912739a988f259fb03a3cbe3913a05
  - path: ../src


build:
  number: 0
  run_exports:
    - {{ pin_subpackage('caputlog', max_pin='x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r caputlog

about:
  home: https://github.com/epics-modules/caPutLog
  license: EPICS Open License
  summary: "Channel Access Put Logger, from DESY/BESSY"
