{% set version = "4.0.0" %}

package:
  name: caputlog
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/caPutLog/archive/refs/tags/R4.0.tar.gz
    sha256: 6b85137906ed44a1f15358ab32fa9b4c450b37c495c65410606ea660ef4feb4c 
  - path: ../src
  - patches:
    - patch/fix_json_memory_leak.p0.patch
    - patch/0001-Add-metadata-information-to-json-output.p0.patch
    - patch/0002-Fix-pvmonitors-for-waveforms.p0.patch

build:
  number: 6
  run_exports:
    - {{ pin_subpackage('caputlog', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base 7.0.8
    - require 5.1

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r caputlog

about:
  home: https://github.com/epics-modules/caPutLog
  license: EPICS Open License
  summary: "Channel Access Put Logger, from DESY/BESSY"
