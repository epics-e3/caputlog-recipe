{% set version = "4.1.0" %}

package:
  name: caputlog
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/caPutLog/archive/refs/tags/R4.1.tar.gz
    sha256: 67ee2374132c8423cb7d2e238b5353229d12de2ce331445a912bed4b27611ce9
  - path: ../src

build:
  number: 3
  run_exports:
    - {{ pin_subpackage('caputlog', max_pin='x.x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - perl
  host:
    - epics-base
    - require

test:
  source_files:
    - ./test
  requires:
    - run-iocsh
    - pytest
    - p4p
    - pyepics
  commands:
    - run-iocsh -r caputlog
    - pytest -v

about:
  home: https://github.com/epics-modules/caPutLog
  summary: "EPICS support module that provides logging for Channel Access and PV Access put operations"
